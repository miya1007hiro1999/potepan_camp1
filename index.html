<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <h1 class="header-logo">
            <a href="https://camp.potepan.com/" class="header-logo__link">
                <img class="header-logo__img" src="img/header-logo.png" alt="potepan camp-ポテパンキャンプ-" />
            </a>
        </h1>

        <nav class="header-nav">
            <div class="header-nav__hamburger ">
                <span class="header-nav__line"></span>
                <span class="header-nav__line"></span>
                <span class="header-nav__line"></span>
            </div>

            <ul class="header-nav__list">
                <li class="header-nav__item">
                    <a href="https://camp.potepan.com/content">
                        <span class="header-nav__content header-nav__content--en">CONTENT</span>
                        <span class="header-nav__content header-nav__content--jp">学習内容</span>
                    </a>
                </li>
                <li class="header-nav__item">
                    <a href="https://camp.potepan.com/interview">
                        <span class="header-nav__content header-nav__content--en">INTERVIEW</span>
                        <span class="header-nav__content header-nav__content--jp">受講生の声</span>
                    </a>
                </li>
                <li class="header-nav__item">
                    <a href="https://camp.potepan.com/faq">
                        <span class="header-nav__content header-nav__content--en">FAQ</span>
                        <span class="header-nav__content header-nav__content--jp">よくある質問</span>
                    </a>
                </li>
                <li class="header-nav__item">
                    <a href="https://camp.potepan.com/recruit">
                        <span class="header-nav__content header-nav__content--en">RECRUIT</span>
                        <span class="header-nav__content header-nav__content--jp">採用企業様へ</span>
                    </a>
                </li>
                <li class="header-nav__item">
                    <a href="https://camp.potepan.com/courses/free-under-29">
                        <span class="header-nav__content header-nav__content--en">U29</span>
                        <span class="header-nav__content header-nav__content--jp">29歳以下の方へ</span>
                    </a>
                </li>
                <li class="header-nav__item">
                    <a class="header-nav__button" href="https://camp.potepan.com/contact">
                        無料カウンセリング
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="fv">
            <img class="fv__left-rectangle" src="img/left-rectangle.svg" alt="三角形左上" />
            <img class="fv__right-rectangle" src="img/right-rectangle.svg" alt="三角形右下" />
            <img class="fv__fill-rectangle" src="img/fill-rectangle.svg" alt="斜めボーダー" />
            <picture>
                <source media="(max-width: 768px)" srcset="img/whole-visual.webp" />

                <img class="fv__main-visual" src="img/main-visual.webp" alt="potepan camp-ポテパンキャンプ-" />
            </picture>
            <div class="fv-container">
                <div class="fv-inner">
                    <h2 class="fv-container__heading">実践的カリキュラムと</br>
                        豊富な提携求人で</br>
                        確実にITエンジニアへ
                        <img class="fv-container__badge" src="img/badge.svg" alt="webエンジニア排出No.1" />
                    </h2>
                    <a class="fv-container__button" href="https://camp.potepan.com/contact">まずは無料カウンセリング</a>
                    <p class="fv-container__content">※ショッパーズアイ「プログラミングスクール10社を対象にしたサイト比較イメージ調査</br>
                        （2020 年 5 月 22 日～25 日）」より全国の22～49歳の男女691名へのインターネット調査</p>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
